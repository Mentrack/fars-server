# pnpm blocks dependency install scripts by default. These packages need theirs:
# native bindings (argon2, bcrypt, @swc/core) and the Prisma engines/client.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  bcrypt: true
  prisma: true
  # Install-time telemetry ping pulled in by swagger-ui-dist; not needed.
  '@scarf/scarf': false
